map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map "$cookie_wcu_platform_session:$cookie_session" $new_api_needs_sso {
  default 0;
  "~^.+:$" 1;
}

# Production binds this gateway to 127.0.0.1 behind the trusted Baota reverse
# proxy. Baota appends the real client as the last X-Forwarded-For hop, while
# the Docker gateway address itself is identical for every visitor. Normalize
# that last hop into an internal-only header so login throttling never turns
# the shared gateway address into a global administrator lock.
map $http_x_forwarded_for $wcu_client_ip {
  default $remote_addr;
  ~^(?:.*,[[:space:]]*)?(?<wcu_forwarded_client>[^,[:space:]]+)[[:space:]]*$ $wcu_forwarded_client;
}

# Docker service addresses can change whenever a container is recreated. Keep
# upstream DNS fresh so the gateway never sends platform traffic to a stale IP.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream zhanji_web {
  zone zhanji_web 64k;
  server web:3000 resolve;
  keepalive 32;
}

upstream zhanji_platform_api {
  zone zhanji_platform_api 64k;
  server platform-api:3000 resolve;
  keepalive 32;
}

upstream zhanji_new_api {
  zone zhanji_new_api 64k;
  server new-api:3000 resolve;
  keepalive 32;
}

upstream zhanji_bookstack {
  zone zhanji_bookstack 64k;
  server bookstack:80 resolve;
  keepalive 16;
}

server {
  listen 80 default_server;
  server_name _;
  absolute_redirect off;
  client_max_body_size 100m;

  # Use one browser origin locally. BookStack emits absolute asset and OIDC
  # URLs, so mixing localhost and 127.0.0.1 breaks CSP, cookies and callbacks.
  if ($host = "127.0.0.1") {
    return 308 http://localhost$request_uri;
  }

  error_page 401 = @wcu_login;

  location = /_wcu-auth-check {
    internal;
    proxy_http_version 1.1;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_pass http://zhanji_platform_api/api/auth/guard;
  }

  location @wcu_login {
    return 302 /login?next=$request_uri;
  }

  location /_wcu-api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-WCU-Client-IP $wcu_client_ip;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://zhanji_platform_api/api/;
  }

  location = /platform-api/v1 {
    return 308 /platform-api/v1/;
  }

  location /platform-api/v1/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_pass http://zhanji_platform_api/api/v1/;
  }

  location = /bookstack {
    return 302 /bookstack/;
  }

  location /bookstack/ {
    auth_request /_wcu-auth-check;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Prefix /bookstack;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    rewrite ^/bookstack/(.*)$ /$1 break;
    proxy_pass http://zhanji_bookstack;
  }

  location = /api {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_pass http://zhanji_web;
  }

  location = /api/ {
    return 302 /api;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_pass http://zhanji_new_api;
  }

  location ~ ^/(static/|favicon\.ico$|logo\.png$|manifest\.json$) {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_pass http://zhanji_new_api;
  }

  # The OIDC callback must reach New API before its own session cookie exists.
  # Protect it with the platform session, but do not send it back through the
  # generic SSO bootstrap rule or the callback will loop through /api forever.
  location = /oauth/oidc {
    auth_request /_wcu-auth-check;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_pass http://zhanji_new_api;
  }

  # New API administrators use credentials that are intentionally independent
  # from platform creator SSO. Keep one explicit entry point outside the
  # generic SSO bootstrap rule, then return to the protected settings console
  # after New API establishes its own session cookie.
  location = /api-admin {
    add_header Set-Cookie "session=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax" always;
    return 302 /sign-in?redirect=%2Fsystem-settings;
  }

  location = /sign-in {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_pass http://zhanji_new_api;
  }

  location ~ ^/(setup(?:/|$)|console(?:/|$)|oauth(?:/|$)|forbidden(?:/|$)|chat2link(?:/|$)|sign-in(?:/|$)|sign-up(?:/|$)|dashboard(?:/|$)|keys(?:/|$)|channels(?:/|$)|usage-logs(?:/|$)|wallet(?:/|$)|profile(?:/|$)|playground(?:/|$)|system-settings(?:/|$)|users(?:/|$)|redemption-codes(?:/|$)|subscriptions(?:/|$)|pricing(?:/|$)|rankings(?:/|$)|models(?:/|$)) {
    auth_request /_wcu-auth-check;
    if ($new_api_needs_sso) {
      return 302 /api?redirect=$request_uri;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_pass http://zhanji_new_api;
  }

  location /assets/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://zhanji_new_api;
  }

  location /v1/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_pass http://zhanji_new_api;
  }

  location /pg/ {
    auth_request /_wcu-auth-check;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_pass http://zhanji_new_api;
  }

  # The retired Jeecg gateway permanently redirected /admin to /admin/.
  # Browsers may retain that 308, so serve the slash variant internally as the
  # native Next.js /admin page instead of redirecting it back and creating a
  # client-side loop for returning operators.
  location = /admin {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://zhanji_web;
  }

  location = /admin/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    rewrite ^ /admin break;
    proxy_pass http://zhanji_web;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://zhanji_web;
  }
}
