server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /__reset_admin_cache__ {
    default_type text/html;
    add_header Clear-Site-Data '"cache", "storage"' always;
    add_header Cache-Control 'no-store, no-cache, must-revalidate, max-age=0' always;
    return 200 '<!doctype html><meta charset="utf-8"><title>后台缓存已清理</title><script>location.replace("/admin/login")</script>';
  }

  location = /index.html {
    add_header Cache-Control 'no-store, no-cache, must-revalidate, max-age=0' always;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control 'no-store, no-cache, must-revalidate, max-age=0' always;
    try_files $uri =404;
  }

  location = /_app.config.js {
    add_header Cache-Control 'no-store, no-cache, must-revalidate, max-age=0' always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control 'no-store' always;
    try_files $uri $uri/ /index.html;
  }
}
